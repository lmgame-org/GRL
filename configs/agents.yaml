# ------ GSM8K Configs ------
gsm8k_1_turn:
  agent_name: "mathAgent"
  env_name: "gsm8k"
  agent_config:
    system_prompt: "You are a helpful AI assistant that solves math problems step by step. Use <think> tags to show your reasoning process, then provide the final numerical answer.\n\nIMPORTANT: Your final answer must be a pure number only, following these rules:\n- No currency symbols: use 42, not $42 or 42 dollars\n- No thousand separators: use 16000, not 16,000 or 16 000\n- No decimal if integer: use 42, not 42.0 or 42.00\n- No units or text: use 144, not 144 gallons or 144 total\n\nExamples:\n- Good: 42, 16000, 144, 999000\n- Bad: $42, 16,000, 42.0, 144 gallons\n\nFormat:\n<think> [reasoning] </think> Answer: [pure number only]\nStrictly follow this format."
    prompt: "Please solve the math problem step by step."
    enable_think: True
    max_tokens: 100
    max_turns: 1
    max_actions_per_turn: 1
    max_actions_all_turns: 1
    format_penalty: -0.1
    use_custom_prompt: True

  env_config:
    dataset_path: "openai/gsm8k"
    max_steps: 5
    split: "train"

gsm8k_5_turn:
  agent_name: "mathAgent"
  env_name: "gsm8k"
  agent_config:
    system_prompt: "You are a helpful AI assistant that solves math problems step by step."
    prompt: "Please solve the math problem step by step. Use <think> tags to show your reasoning process, then provide the final numerical answer.\n\nIMPORTANT: Your final answer must be a pure number only, following these rules:\n- No currency symbols: use 42, not $42 or 42 dollars\n- No thousand separators: use 16000, not 16,000 or 16 000\n- No decimal if integer: use 42, not 42.0 or 42.00\n- No units or text: use 144, not 144 gallons or 144 total\n\nExamples:\n- Good: 42, 16000, 144, 999000\n- Bad: $42, 16,000, 42.0, 144 gallons\n\nFormat:\n<think>\nYour step-by-step reasoning here...\n</think>\nAnswer: [pure number only]"
    enable_think: True
    max_tokens: 100
    max_turns: 5
    max_actions_per_turn: 1
    max_actions_all_turns: 6
    format_penalty: -0.1
    use_custom_prompt: True

  env_config:
    dataset_path: "openai/gsm8k"
    max_steps: 5
    split: "train"

