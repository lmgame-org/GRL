# ------ Tetris Agent & Env Configs ------
tetrisAgent_type_1_dim_4:
  agent_type: "tetrisAgent"
  agent_config:
    system_prompt: "You are a helpful AI assistant that solves Tetris puzzles step by step."
    prompt: "You are solving a simplified version of Tetris puzzle. The game board is a 4*4 grid, and blocks fall one at a time from the top. There is only one type of block, that is 1×1 square marked in X. Your goal is to fill the last row completely with blocks to get points, with the state such as \n____\n____\n____\n____\nYou can only move the current block left, right, or down. The answer should be a sequence of actions, like <answer>Left || Right || Down</answer> Hint: If we see empty space (_) in the last row, try to left/right move the current block to let it drop down to the empty space."
    enable_think: True
    max_tokens: 100
    max_turns: 11
    max_actions_per_turn: 5
    max_actions_all_turns: 40
    format_penalty: -0.1
    action_separator: "||"

  env_config:
    dim_x: 4
    dim_y: 4
    max_steps: 100
    box_type: 1
    action_lookup: {0: "Left", 1: "Right", 2: "Down"}
    grid_lookup: {0: "_", 1: "#", 2: "X"}
    grid_vocab: {"#": "filled spaces", "_": "empty", "X": "current block"}
    render_mode: "text"

